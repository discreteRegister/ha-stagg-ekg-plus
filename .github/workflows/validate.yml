name: Validate

on:
  push:
  pull_request:
  # The merge queue on main tests each PR merged onto the latest main before it
  # lands, and waits for the required "CI passed" check on that merge group.
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its previous, now outdated run. Runs on
# main, merge groups and schedules each get their own group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (Dependabot bumps them along with the
# version comment), so a moved or replaced tag cannot change what runs here.
# hacs/action and the hassfest action publish no maintained releases, so they
# are pinned to a commit on their default branch.

# Must satisfy requires-python in pyproject.toml, which follows the Home
# Assistant core that uv.lock pins. One place, so the three jobs cannot drift.
env:
  PYTHON_VERSION: "3.14"

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Coverage below fail_under in pyproject.toml fails the job.
      - name: Run tests with coverage
        run: >-
          uv run --locked python -m pytest tests/ -q
          --cov=custom_components/stagg_ekg_plus --cov-report=term-missing

  typing:
    runs-on: ubuntu-latest
    name: Strict typing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run mypy --strict
        run: >-
          uv run --locked python -m mypy --strict custom_components/stagg_ekg_plus/

  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run ruff check
        run: >-
          uv run --locked python -m ruff check custom_components/ tests/ tools/
      - name: Run ruff format --check
        run: >-
          uv run --locked python -m ruff format --check custom_components/ tests/ tools/

  # Lints .github/ itself. zizmor audits the workflows and dependabot.yml for
  # security problems (template injection, excessive permissions, persisted
  # credentials, unpinned or known-vulnerable actions, ...); its online audits
  # use the read-only GITHUB_TOKEN to resolve action refs and advisories.
  # actionlint checks workflow syntax and expressions and runs shellcheck on
  # every run: block. Both are locked in uv.lock (the "workflows" group).
  workflow-security:
    runs-on: ubuntu-latest
    name: Workflow security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked --only-group workflows zizmor --format=github .
      - name: Run actionlint
        run: >-
          uv run --locked --only-group workflows actionlint

  # The only check the main branch ruleset requires. It passes only when every
  # job above passed, so a new job just has to be added to `needs` here, not to
  # the ruleset. `if: always()` makes it run (and fail) when a job failed; a
  # skipped required check would otherwise count as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - validate-hacs
      - validate-hassfest
      - tests
      - typing
      - lint
      - workflow-security
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Job results: $RESULTS"
          exit 1
      - name: All jobs passed
        run: echo "All CI jobs passed."
